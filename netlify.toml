[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24.18.0"

# Carry over the security headers added by the Gatsby version (gatsby-plugin-netlify)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"

# Cache hashed asset filenames long-term
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
